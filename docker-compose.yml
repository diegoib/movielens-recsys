services:
  mlflow-server:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - mlflow-db:/mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: sqlite:////mlflow/mlflow.db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: gs://${GCP_PROJECT_ID}-data/mlflow-artifacts
    command: >
      mlflow server
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --default-artifact-root gs://${GCP_PROJECT_ID}-data/mlflow-artifacts
        --host 0.0.0.0
        --port 5000
        --allowed-hosts "*"
        --cors-allowed-origins "*"
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v25.3.9
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "--brokers", "localhost:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redpanda-init:
    image: redpandadata/redpanda:v25.3.9
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - "rpk topic create events model-predictions -X brokers=redpanda:9092 || true"
    restart: "no"

  redpanda-console:
    image: redpandadata/console:v2.6.0
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - redpanda
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  redis-warmup:
    build:
      context: .
      dockerfile: docker/serving/Dockerfile
    depends_on:
      redis:
        condition: service_started
    environment:
      REDIS_HOST: redis
    command:
      - uv
      - run
      - --no-sync
      - python
      - src/features/load_warm_users.py
      - --parquet_path=gs://movielens-recsys-proj-data/processed/train_dataset.parquet
      - --redis_host=redis
    restart: "no"

  streaming-processor:
    build:
      context: .
      dockerfile: docker/streaming/Dockerfile
    environment:
      REDPANDA_BROKERS: redpanda:9092
      REDIS_HOST: redis
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      redis:
        condition: service_started
    restart: on-failure

  recsys-serving:
    build:
      context: .
      dockerfile: docker/serving/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - redpanda
    environment:
      REDIS_HOST: redis
      MODEL_DIR: artifacts/models
      REDPANDA_BROKERS: redpanda:9092
    volumes:
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 8
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: docker/simulator/Dockerfile
    depends_on:
      recsys-serving:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      redis-warmup:
        condition: service_completed_successfully
    command:
      - uv
      - run
      - --no-sync
      - python
      - src/simulator/online_simulator.py
      - --api_url=http://recsys-serving:8000
      - --redpanda_brokers=redpanda:9092
      - --gcs_dataset_path=gs://movielens-recsys-proj-data/processed/train_dataset.parquet
      - --max_concurrent=10
      - --session_gap_min=10
      - --session_gap_max=60
      - --watch_time_seconds=3
    restart: unless-stopped

volumes:
  mlflow-db:
