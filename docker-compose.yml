services:
  mlflow-server:
    build:
      context: .
      dockerfile: docker/mlflow/Dockerfile
    ports:
      - "5000:5000"
    volumes:
      - mlflow-db:/mlflow
    environment:
      MLFLOW_BACKEND_STORE_URI: sqlite:////mlflow/mlflow.db
      MLFLOW_DEFAULT_ARTIFACT_ROOT: gs://${GCP_PROJECT_ID}-data/mlflow-artifacts
    command: >
      mlflow server
        --backend-store-uri sqlite:////mlflow/mlflow.db
        --default-artifact-root gs://${GCP_PROJECT_ID}-data/mlflow-artifacts
        --host 0.0.0.0
        --port 5000
        --allowed-hosts "*"
        --cors-allowed-origins "*"
    restart: unless-stopped

  redpanda:
    image: redpandadata/redpanda:v25.3.9
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info", "--brokers", "redpanda:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redpanda-init:
    image: redpandadata/redpanda:v25.3.9
    depends_on:
      redpanda:
        condition: service_healthy
    command:
      - rpk
      - topic
      - create
      - events
      - model-predictions
      - --partitions=1
      - --replicas=1
      - --brokers=redpanda:9092
    restart: "no"

  redpanda-console:
    image: redpandadata/console:v2.6.0
    ports:
      - "8080:8080"
    environment:
      KAFKA_BROKERS: redpanda:9092
    depends_on:
      - redpanda
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped

  streaming-processor:
    build:
      context: .
      dockerfile: docker/streaming/Dockerfile
    environment:
      REDPANDA_BROKERS: redpanda:9092
      REDIS_HOST: redis
    depends_on:
      - redpanda-init
      - redis
    restart: on-failure

  recsys-serving:
    build:
      context: .
      dockerfile: docker/serving/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - redpanda
    environment:
      REDIS_HOST: redis
      MODEL_DIR: artifacts/models
      REDPANDA_BROKERS: redpanda:9092
    volumes:
      - ./artifacts:/app/artifacts
    restart: unless-stopped

volumes:
  mlflow-db:
