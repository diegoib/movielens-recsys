x-airflow-common: &airflow-common
  image: apache/airflow:2.10.0
  environment:
    AIRFLOW__CORE__EXECUTOR: SequentialExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth
    GCS_BUCKET: ${GCS_BUCKET:-movielens-recsys-proj-data}
    GCP_REGION: ${GCP_REGION:-us-central1}
    GCP_PROJECT_ID: ${GCP_PROJECT_ID:-movielens-recsys-proj}
    WORKSPACE: /opt/airflow
  volumes:
    - /opt/airflow/dags:/opt/airflow/dags:ro
    - airflow-data:/opt/airflow

services:
  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname Admin \
          --role Admin --email admin@example.com || true
    restart: "no"

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8090:8080"
    restart: unless-stopped

volumes:
  airflow-data:
